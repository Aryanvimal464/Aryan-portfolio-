
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VerityQA | Demo Gallery</title>

  <style>
    :root {
      --bg: #0b0f14;
      --card: #131a22;
      --border: #26323d;
      --text: #f1f5f9;
      --muted: #9aa8b7;
      --green: #4ade80;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 20px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    header h1 {
      font-size: clamp(28px, 5vw, 42px);
      margin-bottom: 12px;
    }

    header h1 span {
      color: var(--green);
    }

    header p {
      color: var(--muted);
      line-height: 1.7;
    }

    .status {
      display: inline-block;
      padding: 7px 13px;
      border: 1px solid #28583d;
      border-radius: 20px;
      color: var(--green);
      font-size: 12px;
    }

    .vgrid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .vcard {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
    }

    .frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
    }

    .vplay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #101820;
      background-size: cover;
      background-position: center;
    }

    .vplay svg {
      width: 58px;
      height: 58px;
      transition: transform .2s;
    }

    .vplay:hover svg {
      transform: scale(1.12);
    }

    .vplay:focus-visible {
      outline: 3px solid var(--green);
      outline-offset: -4px;
    }

    .frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .vtitle {
      padding: 16px;
      font-size: 14px;
      font-weight: 600;
    }

    footer {
      padding-top: 30px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 900px) {
      .vgrid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 24px 14px;
      }

      .vgrid {
        grid-template-columns: 1fr;
        gap: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <h1>Verity<span>QA</span> Demo Gallery</h1>

      <p>
        Explore software testing, QA workflows and automation demos.
        <br>
        Click the green play button to watch videos on this page.
      </p>

      <div class="status">● 8 Demo Videos</div>
    </header>

    <section
      class="vgrid"
      id="vgrid"
      aria-label="VerityQA demo videos">
    </section>

    <footer>
      VerityQA · Software Testing & Quality Assurance
    </footer>

  </main>

  <script>
    // Your 8 YouTube video IDs
    const videoIds = [
      "TuwBpeZytlE",
      "e43E6OmatEc",
      "iJoxy4RzxSo",
      "nDYWyJyyWeQ",
      "KyEZyFgqMvg",
      "-h6eB82C5-4",
      "79KJHzfvYEU",
      "WB4icMZTbPM"
    ];

    const vgrid = document.getElementById("vgrid");

    // Build video gallery
    videoIds.forEach((id, index) => {
      const card = document.createElement("article");
      card.className = "vcard";

      const frame = document.createElement("div");
      frame.className = "frame";

      const button = document.createElement("button");
      button.type = "button";
      button.className = "vplay";
      button.dataset.id = id;

      button.setAttribute(
        "aria-label",
        `Play VerityQA demo ${index + 1}`
      );

      button.style.backgroundImage =
        `linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.25)), ` +
        `url("https://i.ytimg.com/vi/${id}/hqdefault.jpg")`;

      button.innerHTML = `
        <svg viewBox="0 0 52 52" aria-hidden="true">
          <circle
            cx="26"
            cy="26"
            r="24"
            fill="rgba(10,14,16,.75)"
            stroke="#4ADE80"
            stroke-width="2">
          </circle>

          <path
            d="M21 16 L37 26 L21 36 Z"
            fill="#4ADE80">
          </path>
        </svg>
      `;

      frame.appendChild(button);

      const title = document.createElement("div");
      title.className = "vtitle";
      title.textContent = `VerityQA Demo ${index + 1}`;

      card.append(frame, title);
      vgrid.appendChild(card);
    });

    // Restore thumbnails and stop other videos
    function stopAllVideos() {
      const playingFrames = vgrid.querySelectorAll(
        '.frame[data-playing="true"]'
      );

      playingFrames.forEach(frame => {
        const originalButton = frame._originalButton;

        if (originalButton) {
          frame.replaceChildren(originalButton);
        }

        delete frame._originalButton;
        frame.removeAttribute("data-playing");
      });
    }

    // Play video inside the same card
    vgrid.addEventListener("click", function (event) {
      const button = event.target.closest(".vplay");

      if (!button || !vgrid.contains(button)) {
        return;
      }

      event.preventDefault();

      const videoId = button.dataset.id;
      const frame = button.closest(".frame");

      // Save thumbnail button before replacing it
      const originalButton = button.cloneNode(true);

      // Stop previously playing videos
      stopAllVideos();

      const iframe = document.createElement("iframe");

      iframe.src =
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(videoId) +
        "?autoplay=1&playsinline=1&rel=0";

      iframe.title = button.getAttribute("aria-label");

      iframe.setAttribute(
        "allow",
        "autoplay; encrypted-media; picture-in-picture; fullscreen"
      );

      iframe.setAttribute("allowfullscreen", "");
      iframe.setAttribute("loading", "eager");
      iframe.setAttribute(
        "referrerpolicy",
        "strict-origin-when-cross-origin"
      );

      frame._originalButton = originalButton;
      frame.dataset.playing = "true";
      frame.replaceChildren(iframe);
    });
  </script>
</body>
</html>
