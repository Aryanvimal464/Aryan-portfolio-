
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VerityQA | Demo Videos</title>

  <style>
    :root {
      --bg: #0b0f14;
      --card: #131a22;
      --border: #26323d;
      --text: #f1f5f9;
      --muted: #9aa8b7;
      --info: #4ade80;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 20px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .header h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 42px);
    }

    .header h1 span {
      color: var(--info);
    }

    .header p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .status {
      display: inline-block;
      margin-top: 10px;
      padding: 7px 12px;
      border: 1px solid #28583d;
      border-radius: 20px;
      color: var(--info);
      font-size: 12px;
    }

    .vgrid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .vcard {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      transition: border-color .2s;
    }

    .vcard:hover {
      border-color: var(--info);
    }

    .frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
    }

    .vplay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #101820;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .vplay svg {
      width: 58px;
      height: 58px;
      transition: transform .2s;
      filter: drop-shadow(0 2px 8px #0008);
    }

    .vplay:hover svg {
      transform: scale(1.12);
    }

    .vplay:focus-visible {
      outline: 3px solid var(--info);
      outline-offset: -4px;
    }

    .frame iframe {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .vtitle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px;
    }

    .vtitle span {
      font-size: 14px;
      font-weight: 600;
    }

    .vtitle a {
      flex-shrink: 0;
      color: var(--info);
      font-size: 12px;
      text-decoration: none;
    }

    .vtitle a:hover {
      text-decoration: underline;
    }

    .footer {
      padding: 30px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 900px) {
      .vgrid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 24px 14px;
      }

      .vgrid {
        grid-template-columns: 1fr;
        gap: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <h1>Verity<span>QA</span> Demo Gallery</h1>

      <p>
        Explore software testing projects, QA workflows,
        automation demos and testing solutions.
        <br>
        Click any video to play it directly on this page.
      </p>

      <div class="status">● 8 Demo Videos</div>
    </header>

    <section
      class="vgrid"
      id="vgrid"
      aria-label="VerityQA demonstration videos">
    </section>

    <footer class="footer">
      VerityQA · Software Testing & Quality Assurance
    </footer>

  </main>

  <script>
    // All 8 YouTube video IDs
    const videoIds = [
      "TuwBpeZytlE",
      "e43E6OmatEc",
      "iJoxy4RzxSo",
      "nDYWyJyyWeQ",
      "KyEZyFgqMvg",
      "-h6eB82C5-4",
      "79KJHzfvYEU",
      "WB4icMZTbPM"
    ];

    const vgrid = document.getElementById("vgrid");

    // Create the video cards
    videoIds.forEach((id, i) => {
      const card = document.createElement("article");
      card.className = "vcard";

      const frame = document.createElement("div");
      frame.className = "frame";

      const playButton = document.createElement("button");
      playButton.type = "button";
      playButton.className = "vplay";
      playButton.dataset.id = id;
      playButton.setAttribute(
        "aria-label",
        `Play VerityQA demo ${i + 1}`
      );

      // YouTube thumbnail
      playButton.style.backgroundImage =
        `linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.25)), ` +
        `url("https://i.ytimg.com/vi/${id}/hqdefault.jpg")`;

      // Green play icon
      playButton.innerHTML = `
        <svg viewBox="0 0 52 52" aria-hidden="true">
          <circle
            cx="26"
            cy="26"
            r="24"
            fill="rgba(10,14,16,.75)"
            stroke="#4ADE80"
            stroke-width="2">
          </circle>
          <path
            d="M21 16 L37 26 L21 36 Z"
            fill="#4ADE80">
          </path>
        </svg>
      `;

      frame.appendChild(playButton);

      // Card title and optional external YouTube link
      const title = document.createElement("div");
      title.className = "vtitle";

      const label = document.createElement("span");
      label.textContent = `VerityQA Demo ${i + 1}`;

      const youtubeLink = document.createElement("a");
      youtubeLink.href =
        `https://www.youtube.com/watch?v=${id}`;
      youtubeLink.target = "_blank";
      youtubeLink.rel = "noopener noreferrer";
      youtubeLink.textContent = "YouTube ↗";
      youtubeLink.setAttribute(
        "aria-label",
        `Open VerityQA demo ${i + 1} on YouTube in a new tab`
      );

      title.append(label, youtubeLink);
      card.append(frame, title);
      vgrid.appendChild(card);
    });

    // Stop previous video and restore its thumbnail
    function stopAllVideos() {
      vgrid.querySelectorAll(".frame[data-playing='true']")
        .forEach(frame => {
          const button = frame.querySelector(".vplay");

          if (button) {
            frame.replaceChildren(button);
          }

          frame.removeAttribute("data-playing");
        });
    }

    // Play the video inside its existing card
    vgrid.addEventListener("click", event => {
      const button = event.target.closest(".vplay");

      if (!button || !vgrid.contains(button)) return;

      const videoId = button.dataset.id;
      const frame = button.closest(".frame");

      // Only one video plays at a time
      stopAllVideos();

      const iframe = document.createElement("iframe");

      iframe.src =
        `https://www.youtube-nocookie.com/embed/${videoId}` +
        "?autoplay=1&rel=0&playsinline=1";

      iframe.title = button.getAttribute("aria-label");
      iframe.allow =
        "autoplay; encrypted-media; picture-in-picture; fullscreen";
      iframe.allowFullscreen = true;
      iframe.loading = "eager";
      iframe.referrerPolicy = "strict-origin-when-cross-origin";

      frame.dataset.playing = "true";
      frame.replaceChildren(iframe);
    });
  </script>
</body>
</html>
